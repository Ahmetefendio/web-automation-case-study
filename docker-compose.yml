services:
  selenium:
    image: selenium/standalone-chrome:4.52.0
    shm_size: 2gb
    environment:
      - SE_NODE_MAX_SESSIONS=3
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:4444/status"]
      interval: 5s
      retries: 20

  tests:
    build: .
    depends_on:
      selenium:
        condition: service_healthy
    command: ["-Dgrid.url=http://selenium:4444/wd/hub", "-Dheadless=true"]
    volumes:
      - ./target/allure-results:/app/target/allure-results
